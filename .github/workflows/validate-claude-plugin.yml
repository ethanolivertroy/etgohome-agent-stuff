name: Validate Claude Code plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .claude-plugin/marketplace.json
      - name: Validate plugin
        run: claude plugin validate .claude-plugin/plugin.json
      - name: Keep Pi-only content out of the Claude plugin root
        run: |
          if [ -e commands ] || [ -e agents ] || [ -e hooks ]; then
            echo "Root commands/, agents/ or hooks/ would be auto-loaded by Claude Code; put Pi-only content under pi/." >&2
            exit 1
          fi
